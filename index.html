<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta http-equiv="content-language" content="en">
    <meta http-equiv="content-script-type" content="text/javascript">
    <meta http-equiv="content-style-type" content="text/css">
    <meta name="description" content="This is the online markdown editor with live preview.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#444444">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <script>
      (function(){
        try {
          var BOOT_THEME_KEY = 'com.markdownlivepreview_theme';
          var raw = localStorage.getItem(BOOT_THEME_KEY);
          var useDark = raw === 'dark';
          document.documentElement.setAttribute('data-theme', useDark ? 'dark' : 'light');

          var PREVIEW_CSS_LIGHT = 'css/github-markdown-light.css?v=a1a198514565';
          var PREVIEW_CSS_DARK = 'css/github-markdown-dark_dimmed.css?v=5d3f5d9d207c';
          var href = useDark ? PREVIEW_CSS_DARK : PREVIEW_CSS_LIGHT;

          var link = document.createElement('link');
          link.id = 'gh-markdown-link';
          link.rel = 'stylesheet';
          link.type = 'text/css';
          link.href = href;
          document.head.appendChild(link);
        } catch (e) {
          // ignore — app will correct theme after load
        }
      })();
    </script>
    <link rel="stylesheet" type="text/css" href="css/style.css?v=dcb4f446ba54">
    <link rel="icon" type="image/png" href="favicon.png">
    <script type="module" src="/src/main.js?v=1.13.0"></script>
    <title>Markdown Live Preview</title>
  </head>

  <body>

    <header>
        <nav id="menu-items" aria-label="Menu">
            <div id="app-title">
                <a href="/" class="menu-icon" title="Markdown Live Preview" aria-label="Markdown Live Preview">
                    <svg class="logo" viewBox="0 0 208 128" aria-hidden="true"><rect width="198" height="118" x="5" y="5" ry="10" fill="none" stroke="currentColor" stroke-width="10"/><path fill="currentColor" stroke="none" d="M30 98V30h20l20 25 20-25h20v68H90V59L70 84 50 59v39zm125 0l-30-33h20V30h20v35h20z"/></svg>
                </a>
            </div>
            <div>
                <button type="button" id="open-button" class="menu-icon" title="Open file" aria-label="Open file">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                </button>
            </div>
            <input type="file" id="open-file-input" accept=".md,.markdown,text/markdown,.json,application/json" hidden>
            <div id="copy-button">
                <a href="#" class="menu-icon" title="Copy" aria-label="Copy">
                    <svg class="icon-copy" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    <svg class="icon-check" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
                </a>
            </div>
            <div id="share-button">
                <a href="#" class="menu-icon" title="Copy share link" aria-label="Copy share link">
                    <svg class="icon-share" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                    <svg class="icon-check" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
                </a>
            </div>
            <div id="export-button">
                <a href="#" class="menu-icon" title="Export PDF" aria-label="Export PDF">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                </a>
            </div>
            <div id="reset-button">
                <a href="#" class="menu-icon" title="Reset" aria-label="Reset">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                </a>
            </div>
            <div id="outline-toggle">
                <button type="button" id="outline-button" class="menu-icon" title="Outline" aria-label="Outline" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                </button>
            </div>
            <div id="search-toggle" class="touch-only">
                <button type="button" id="search-button" class="menu-icon" title="Search" aria-label="Search">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </button>
            </div>
            <div id="view-modes" role="group" aria-label="View">
                <button type="button" class="menu-icon" data-view="editor" title="Editor only" aria-label="Editor only" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                </button>
                <button type="button" class="menu-icon" data-view="split" title="Editor and preview" aria-label="Editor and preview" aria-pressed="true">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
                </button>
                <button type="button" class="menu-icon" data-view="preview" title="Preview only" aria-label="Preview only" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <div id="sync-button" class="menu-toggle">
                <input type="checkbox" id="sync-scroll-checkbox" class="visually-hidden">
                <label for="sync-scroll-checkbox" class="menu-icon" title="Sync scroll">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7h3a5 5 0 0 1 5 5 5 5 0 0 1-5 5h-3m-6 0H6a5 5 0 0 1-5-5 5 5 0 0 1 5-5h3"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                    <span class="visually-hidden">Sync scroll</span>
                </label>
            </div>
            <div id="theme-button" class="menu-toggle">
                <input type="checkbox" id="theme-checkbox" class="visually-hidden">
                <label for="theme-checkbox" class="menu-icon" title="Dark mode">
                    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <span class="visually-hidden">Dark mode</span>
                </label>
            </div>
            <div id="github">
                <a href="https://github.com/tanabe/markdown-live-preview" class="menu-icon" title="GitHub" aria-label="GitHub"><img src="image/GitHub-Mark-Light-32px.webp" alt=""></a>
            </div>
        </nav>
    </header>

    <div id="outline-backdrop" hidden></div>
    <aside id="outline-panel" aria-label="Outline" hidden>
        <div class="outline-header">
            <span>Outline</span>
            <button type="button" id="outline-close" aria-label="Close outline" title="Close outline">&#10005;</button>
        </div>
        <nav id="outline-list"></nav>
    </aside>

    <div id="container" class="split-container">

        <div id="edit" class="column editor-pane">
            <div id="editor-wrapper">
                <div id="editor"></div>
            </div>
        </div>

        <div id="split-divider" class="split-divider"></div>

        <div id="preview" class="column preview-pane">
            <div id="preview-search-anchor">
                <div id="preview-search" class="preview-search" role="search" hidden>
                    <input type="text" id="preview-search-input" placeholder="Find in preview" aria-label="Find in preview" autocomplete="off" spellcheck="false">
                    <span id="preview-search-count" class="preview-search-count" aria-live="polite"></span>
                    <button type="button" id="preview-search-case" class="preview-search-toggle" aria-pressed="false" aria-label="Match case" title="Match case">Aa</button>
                    <button type="button" id="preview-search-prev" aria-label="Previous match" title="Previous match (Shift+Enter)">&#8593;</button>
                    <button type="button" id="preview-search-next" aria-label="Next match" title="Next match (Enter)">&#8595;</button>
                    <button type="button" id="preview-search-close" aria-label="Close search" title="Close (Escape)">&#10005;</button>
                </div>
            </div>
            <div id="preview-wrapper">
                <div id="output" class="content markdown-body"></div>
            </div>
        </div>
    </div>

    <div id="notice" role="status" aria-live="polite" hidden></div>

    <footer></footer>
  </body>
</html>
